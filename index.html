<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR.js Prueba Mínima</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
</head>
<body>
  <a-scene embedded arjs="debugUIEnabled: true;">
    <!-- El cubo rojo aparecerá sobre el marcador HIRO -->
    <a-marker-camera preset="hiro">
      <a-box position="0 0.5 0" material="color: red;" scale="0.5 0.5 0.5"></a-box>
    </a-marker-camera>
  </a-scene>
</body>
</html>
