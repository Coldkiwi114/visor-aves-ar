<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Visor AR - Aves de México</title>
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/ar.js@2.2.2/aframe/build/aframe-ar.min.js"></script>
  <style>
    /* ... (todos los estilos se mantienen igual) ... */
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #titulo {
      position: absolute;
      top: 20px;
      left: 0;
      right: 0;
      text-align: center;
      color: white;
      font-size: 1.4rem;
      font-weight: 700;
      text-shadow: 0 2px 12px rgba(0,0,0,0.9);
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      padding: 12px 20px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 40px;
      border: 1px solid rgba(255, 215, 0, 0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      z-index: 20;
      pointer-events: none;
      letter-spacing: 0.5px;
      line-height: 1.3;
      max-width: 90%;
    }
    #titulo .destacar { color: #ffd700; }
    #info-panel {
      position: absolute;
      bottom: 70px;
      left: 20px;
      right: 20px;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      color: white;
      padding: 20px 25px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
    }
    #info-panel h2 { margin: 0 0 8px 0; font-size: 1.6rem; font-weight: 700; color: #ffd700; }
    #info-panel p { margin: 5px 0; font-size: 1rem; line-height: 1.5; opacity: 0.9; }
    #info-panel .cientifico { font-style: italic; color: #aaddff; font-size: 0.9rem; }
    #curiosidad-panel {
      position: absolute;
      top: 90px;
      right: 20px;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      color: #fff;
      padding: 15px 20px;
      border-radius: 12px;
      max-width: 260px;
      font-size: 0.95rem;
      line-height: 1.4;
      border-left: 5px solid #ffd700;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
      pointer-events: none;
      z-index: 10;
      text-align: left;
      transition: opacity 0.3s ease;
    }
    #curiosidad-panel strong { color: #ffd700; display: block; margin-bottom: 5px; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
    #curiosidad-panel .curiosidad-texto { font-size: 0.95rem; }
    #instruccion {
      position: absolute;
      bottom: 15px;
      left: 0;
      right: 0;
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-size: 0.95rem;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      pointer-events: none;
      z-index: 10;
      background: rgba(0,0,0,0.25);
      backdrop-filter: blur(4px);
      padding: 6px 16px;
      width: fit-content;
      margin: 0 auto;
      border-radius: 30px;
      letter-spacing: 0.3px;
      border: 1px solid rgba(255,255,255,0.1);
    }
    @media (max-width: 600px) {
      #titulo { font-size: 1.0rem; padding: 10px 16px; top: 12px; }
      #curiosidad-panel { top: 80px; right: 10px; max-width: 170px; padding: 12px 14px; font-size: 0.8rem; }
      #info-panel { padding: 15px 18px; bottom: 65px; left: 10px; right: 10px; }
      #info-panel h2 { font-size: 1.2rem; }
      #info-panel p { font-size: 0.85rem; }
      #instruccion { font-size: 0.8rem; bottom: 10px; padding: 4px 12px; }
    }
  </style>
</head>
<body>
  <div id="titulo"><span class="destacar">"Ecos del Cielo"</span> 🌿<br>Aves de Emiliano Zapata en Realidad Aumentada</div>
  <div id="curiosidad-panel"><strong>✨ Curiosidad</strong><span id="curiosidad-texto" class="curiosidad-texto">Cargando...</span></div>
  <div id="info-panel">
    <h2 id="nombre-ave">🦜 Cargando...</h2>
    <p><strong>Nombre científico:</strong> <span id="cientifico" class="cientifico">---</span></p>
    <p id="caracteristicas"><strong>Características:</strong> ---</p>
    <p id="envergadura"><strong>Envergadura / Tamaño:</strong> ---</p>
  </div>
  <div id="instruccion">🔍 Apunta la cámara al marcador específico de cada ave</div>

  <!-- Escena AR: sin marcador por defecto, se configurará con JS -->
  <a-scene embedded arjs>
    <a-entity id="modelo-ave" gltf-model="" scale="0.15 0.15 0.15" position="0 0 0"></a-entity>
  </a-scene>

  <script>
    // ============================================================
    // 1. DATOS DE LAS 4 AVES CON RUTA DE MARCADOR
    // ============================================================
    const avesData = {
      1: {
        nombre: "🦆 Pijije Aliblanco",
        cientifico: "Dendrocygna autumnalis",
        caracteristicas: "Pato mediano con pico y patas de color rosa coral. Espalda castaña rojiza y alas negras con una gran mancha blanca muy visible en vuelo.",
        envergadura: "Mide unos 48 cm de largo",
        curiosidad: "Es un ave muy sociable y ruidosa. Su nombre 'pijije' imita su característico silbido. Se le puede ver posado en árboles, algo inusual en patos.",
        modelo: "models/ave1.glb",
        escala: "0.15 0.15 0.15",
        marcador: "markers/pattern-ave1.patt"   // Ruta al archivo .patt
      },
      2: {
        nombre: "🐔 Chachalaca",
        cientifico: "Ortalis poliocephala",
        caracteristicas: "Ave grande, de cola larga y cuerpo redondeado, similar a un faisán. Plumaje pardo oliváceo con vientre más claro y puntas blancas en la cola.",
        envergadura: "Tamaño similar a un faisán",
        curiosidad: "Es casi siempre escuchada antes de ser vista, ya que sus llamadas son un ruidoso y rítmico 'chacar-rac-rac' que retumba en el bosque.",
        modelo: "models/ave2.glb",
        escala: "0.2 0.2 0.2",
        marcador: "markers/pattern-ave2.patt"
      },
      3: {
        nombre: "🐦 Garza Tigre Mexicana",
        cientifico: "Tigrisoma mexicanum",
        caracteristicas: "Garza de aspecto primitivo y patas cortas. El adulto tiene el plumaje finamente barrado (rayado) que le da su nombre, y la garganta desnuda de color amarillo.",
        envergadura: "Es una garza grande, de patas cortas",
        curiosidad: "Es un ave solitaria y de hábitos reservados. Prefiere cazar pacientemente en manglares y humedales, alimentándose de peces, ranas y cangrejos.",
        modelo: "models/ave3.glb",
        escala: "0.12 0.12 0.12",
        marcador: "markers/pattern-ave3.patt"
      },
      4: {
        nombre: "🐤 Benteveo Común",
        cientifico: "Pitangus sulphuratus",
        caracteristicas: "Cabeza negra con dos franjas blancas a modo de cejas y pecho amarillo vivo. Es un ave de cabeza y pico grandes para su tamaño.",
        envergadura: "Mide entre 21 y 26 cm de largo",
        curiosidad: "Su nombre proviene de su canto, que suena como 'bien-te-veo'. Es un ave muy territorial y oportunista, que come casi de todo.",
        modelo: "models/ave4.glb",
        escala: "0.18 0.18 0.18",
        marcador: "markers/pattern-ave4.patt"
      }
    };

    // ============================================================
    // 2. OBTENER ID DESDE LA URL
    // ============================================================
    function getParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    let id = parseInt(getParam('id')) || 1;
    if (!avesData[id]) id = 1;
    const ave = avesData[id];

    // ============================================================
    // 3. ACTUALIZAR PANELES DE INFORMACIÓN
    // ============================================================
    document.getElementById('nombre-ave').textContent = ave.nombre;
    document.getElementById('cientifico').textContent = ave.cientifico;
    document.getElementById('caracteristicas').innerHTML = `<strong>Características:</strong> ${ave.caracteristicas}`;
    document.getElementById('envergadura').innerHTML = `<strong>Envergadura / Tamaño:</strong> ${ave.envergadura}`;
    document.getElementById('curiosidad-texto').textContent = ave.curiosidad;

    // ============================================================
    // 4. CARGAR MODELO 3D CON SU ESCALA
    // ============================================================
    const modeloEntity = document.getElementById('modelo-ave');
    modeloEntity.setAttribute('gltf-model', 'url(' + ave.modelo + ')');
    modeloEntity.setAttribute('scale', ave.escala);

    // ============================================================
    // 5. CONFIGURAR EL MARCADOR PERSONALIZADO
    // ============================================================
    const scene = document.querySelector('a-scene');
    if (ave.marcador) {
      scene.setAttribute('arjs', `patternUrl: ${ave.marcador}`);
    }

    console.log(`Cargando ave ${id}: ${ave.nombre} con marcador ${ave.marcador}`);
  </script>
</body>
</html>
